name: Retail Demand Forecasting CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Train model
      run: python train_model.py

    - name: Predict
      run: python predict.py

    - name: Drift monitoring
      run: python drift_monitor.py

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker images
      run: |
        docker build -t train_model -f Dockerfile .
        docker build -t predict_model -f Dockerfile .
        docker build -t drift_monitor -f Dockerfile .
        docker build -t api_model -f Dockerfile .

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Save SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/aws_key.pem
        chmod 600 ~/.ssh/aws_key.pem

    - name: Copy code to EC2
      run: |
        rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem" ./ ubuntu@3.111.40.210:/home/ubuntu/Retail-Demand-Forecasting-with-Drift-Monitoring

    - name: Deploy Docker on EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ubuntu@3.111.40.210 \
        "cd Retail-Demand-Forecasting-with-Drift-Monitoring && docker-compose down && docker-compose up --build -d"
